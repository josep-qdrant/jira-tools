installed:
- agent-context
- product
settings:
  auto_execute_hooks: true
hooks:
  after_specify:
  - extension: agent-context
    command: speckit.agent-context.update
    enabled: true
    optional: true
    priority: 10
    prompt: Execute speckit.agent-context.update?
    description: Refresh agent context after specification
    condition: null
  - extension: product
    command: speckit.product.brief
    enabled: true
    optional: true
    priority: 10
    prompt: Generate the product brief (product/00-info.md + product/10-spec.md) from
      the new spec.md?
    description: Generate product/00-info.md and product/10-spec.md from spec.md (recommended
      first artifacts)
    condition: null
  after_plan:
  - extension: agent-context
    command: speckit.agent-context.update
    enabled: true
    optional: true
    priority: 10
    prompt: Execute speckit.agent-context.update?
    description: Refresh agent context after planning
    condition: null
  - extension: product
    command: speckit.product.plan
    enabled: true
    optional: true
    priority: 10
    prompt: Generate the product-facing plan product/20-plan.md from plan.md?
    description: Generate product/20-plan.md from plan.md
    condition: null
  after_clarify:
  - extension: product
    command: speckit.product.brief
    enabled: true
    optional: true
    priority: 10
    prompt: Regenerate the product brief after clarification?
    description: Update product/00-info.md and product/10-spec.md from the clarified
      spec.md
    condition: null
